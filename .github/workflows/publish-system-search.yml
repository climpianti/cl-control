name: Publish CL Control 3.5.3-beta.22
on:
  push:
    branches: [fix/yellow-power-controls-beta22]
    paths:
      - ".github/workflows/publish-system-search.yml"
      - "custom_components/cl_control/manifest.json"
      - "tests/**"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate
        run: |
          python -m compileall -q custom_components/cl_control
          for f in custom_components/cl_control/frontend/*.mjs; do node --check "$f"; done
          python tests/run_offline.py
          python - <<'PY'
          import json
          with open('custom_components/cl_control/manifest.json') as f:
              assert json.load(f)['version'] == '3.5.3-beta.22'
          PY
      - name: Build HACS package
        run: |
          zip -q -r cl-control-3.5.3-beta.22.zip custom_components/cl_control -x '*/__pycache__/*' '*.pyc'
          sha256sum cl-control-3.5.3-beta.22.zip > cl-control-3.5.3-beta.22.zip.sha256
      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v3.5.3-beta.22 cl-control-3.5.3-beta.22.zip cl-control-3.5.3-beta.22.zip.sha256 --target "$GITHUB_SHA" --prerelease --title "CL Control 3.5.3-beta.22 — card interruttori Glass e preset negli Scenari" --notes "Beta di collaudo basata su v3.5.3-beta.17: card switch con pulsante Power circolare, rimozione tavolozza dalle luci e preset gestiti in Scenari. Mantiene le card CL Control e i comandi esistenti. Consigliato backup e verifica UI dopo aggiornamento."
