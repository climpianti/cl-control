name: Build signed CL Control artifact

on:
  workflow_dispatch:
    inputs:
      channel:
        description: Release channel
        required: true
        default: dev
        type: choice
        options: [stable, beta, dev]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install cryptography
      - name: Materialize ephemeral signing key
        env:
          SIGNING_KEY: ${{ secrets.CL_CONTROL_RELEASE_SIGNING_KEY }}
        run: |
          test -n "$SIGNING_KEY"
          printf '%s' "$SIGNING_KEY" > "$RUNNER_TEMP/cl-control-signing-key.pem"
          chmod 600 "$RUNNER_TEMP/cl-control-signing-key.pem"
      - name: Build signed bundle
        run: python scripts/build_release.py --output dist --channel "${{ inputs.channel }}" --signing-key "$RUNNER_TEMP/cl-control-signing-key.pem"
      - uses: actions/upload-artifact@v4
        with:
          name: cl-control-signed-${{ inputs.channel }}
          path: dist/
          if-no-files-found: error
