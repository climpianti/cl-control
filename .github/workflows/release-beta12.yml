name: Publish CL Control 3.5.3-beta.12 - Energy Glass

on:
  push:
    branches:
      - beta/3.5.3-beta.12

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check versions and syntax
        run: |
          python -m compileall -q custom_components/cl_control tests
          python - <<'PY'
          import json
          from pathlib import Path
          v = "3.5.3-beta.12"
          assert json.loads(Path("custom_components/cl_control/manifest.json").read_text())["version"] == v
          assert f'VERSION = "{v}"' in Path("custom_components/cl_control/const.py").read_text()
          assert f'ASSET_REVISION = "{v}-r1"' in Path("custom_components/cl_control/frontend.py").read_text()
          PY
      - name: Run Python offline regressions
        run: python tests/run_offline.py
      - name: Browser regressions with simulated devices
        run: |
          npm install --no-save playwright@1.62.1
          npx playwright install --with-deps chromium
          node tests/test_home_glass.cjs
          node tests/test_light_memories_ui.cjs
          node tests/test_scenes_guided.cjs
      - name: Energy curve and time-series regression
        run: |
          node tests/test_energy_curves.cjs
          node tests/test_energy_missing_data.cjs
          node tests/test_energy_schematic.cjs
      - name: Build release ZIP and checksum
        run: python scripts/build_release.py
      - name: Publish prerelease after successful tests
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v3.5.3-beta.12 >/dev/null 2>&1; then
            echo "Prerelease exists: ensure GitHub marks it as a prerelease."
            gh release edit v3.5.3-beta.12 --prerelease
            exit 0
          fi
          gh release create v3.5.3-beta.12 \
            dist/cl-control-3.5.3-beta.12.zip dist/SHA256SUMS.txt \
            --target "$GITHUB_SHA" \
            --title "CL Control 3.5.3-beta.12 - Energy Blue Tech" \
            --prerelease \
            --notes "Beta di collaudo basata sulla beta.11. Nuovi grafici energetici SVG monotoni, sfumature e tooltip Glass, senza interpolare valori non disponibili, e confronto relativo dei carichi. Conserva la navigazione Home, le API, i dati e i comandi. Test Python, curve, mobile e browser prima della pubblicazione. Per rollback reinstallare la beta.11."
