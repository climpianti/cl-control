<script type="module">
  import '../custom_components/cl_control/frontend/cl-control-panel.js';
  const state=(entity_id,state,attributes={})=>({entity_id,state,attributes:{friendly_name:entity_id.split('.')[1].replaceAll('_',' '),...attributes}});
  const states=Object.fromEntries([
    state('light.cucina','on',{friendly_name:'Cucina',brightness:184,supported_color_modes:['rgbw','color_temp'],rgb_color:[255,190,80],hs_color:[38,70],color_temp_kelvin:3200,min_color_temp_kelvin:2000,max_color_temp_kelvin:6500}),
    state('light.soggiorno','off',{friendly_name:'Soggiorno',brightness:120}),
    state('light.camera','on',{friendly_name:'Camera',brightness:90}),
    state('light.portico','unavailable',{friendly_name:'Portico'}),
    state('light.lampadario_ingresso_nome_molto_lungo','off',{friendly_name:'Lampadario ingresso con nome volutamente molto lungo'}),
    state('light.cl_power_control_status','unavailable',{friendly_name:'CL Power Control status'}),
    state('switch.lampada_ingresso','off',{friendly_name:'Lampada ingresso'}),
    state('switch.shellyplus1pm_84cca8ff1200','off',{friendly_name:'ShellyPlus1PM-84CCA8FF1200'}),
    state('cover.tapparella_soggiorno','open',{friendly_name:'Tapparella soggiorno',device_class:'shutter',current_position:62,supported_features:15}),
    state('cover.finestra_cucina','closed',{friendly_name:'Finestra cucina',device_class:'window',current_position:0,supported_features:15}),
    state('cover.cancello','closed',{friendly_name:'Cancello',device_class:'gate',supported_features:11}),
    state('climate.zona_giorno','heat',{friendly_name:'Zona giorno',current_temperature:21.4,temperature:22,min_temp:7,max_temp:35,target_temp_step:.5,hvac_modes:['off','heat','cool'],fan_modes:['auto','low','high'],preset_modes:['eco','comfort'],swing_modes:['off','vertical'],current_humidity:48,humidity:50}),
    state('sensor.home_power','620',{friendly_name:'Consumo casa',unit_of_measurement:'W',device_class:'power'}),
    state('sensor.solar_power','1100',{friendly_name:'Fotovoltaico',unit_of_measurement:'W',device_class:'power'}),
    state('sensor.co2_salone','820',{friendly_name:'CO2 salone',unit_of_measurement:'ppm',device_class:'carbon_dioxide'}),
    state('sensor.umidita_salone','48',{friendly_name:'Umidità salone',unit_of_measurement:'%',device_class:'humidity'}),
    state('sensor.pm25_camera','8',{friendly_name:'PM2.5 camera',unit_of_measurement:'µg/m³',device_class:'pm25'}),
    state('sensor.temperatura_camera','22.4',{friendly_name:'Temperatura camera',unit_of_measurement:'°C',device_class:'temperature'}),
    state('sensor.qualita_aria_incerta','42',{friendly_name:'Qualità aria'}),
    state('camera.ingresso','idle',{friendly_name:'Ingresso'}),
    state('camera.giardino','idle',{friendly_name:'Giardino'}),
    state('media_player.salone','playing',{friendly_name:'Diffusore salone',media_title:'Jazz serale'}),
    state('alarm_control_panel.casa','disarmed',{friendly_name:'Allarme casa'}),
    state('binary_sensor.porta_ingresso','off',{friendly_name:'Porta ingresso',device_class:'door'}),
    state('binary_sensor.movimento_salone','on',{friendly_name:'Movimento salone',device_class:'motion'}),
    state('binary_sensor.bar_serranda','off',{friendly_name:'Bar Serranda'}),
  ].map(item=>[item.entity_id,item]));
  const bootstrap={version:'3.4.2-dev',branding:{brand_name:'CL Control',company_name:'CL Impianti',product_name:'CL Control',assets:{logo:'../custom_components/cl_control/frontend/logo.png'},colors:{primary:'#19BAFF',secondary:'#164C78',accent:'#32E394',background:'#061324',surface:'#123852',surface_alt:'#071D34',text:'#F4F9FF',muted:'#8FA9C5',warning:'#FFD05C',danger:'#FF5B69',line:'rgba(140,201,255,.18)',light_default_rgb:'255,208,92'},typography:{font_family:'Inter,system-ui,sans-serif'},design_tokens:{spacing:{xs:'4px',sm:'8px',md:'12px',lg:'16px',xl:'24px',xxl:'32px'},radius:{sm:'8px',md:'12px',lg:'18px',xl:'24px',pill:'999px'},shadow:{low:'0 4px 14px rgba(0,0,0,.12)',medium:'0 12px 30px rgba(0,0,0,.18)',high:'0 20px 48px rgba(0,0,0,.24)'},icon_size:{sm:'18px',md:'22px',lg:'28px'},typography_scale:{micro:'10px',caption:'12px',label:'13px',body_small:'14px',body:'15px',section:'17px',heading:'20px',page:'26px',title:'24px',display:'32px'},font_weight:{regular:400,medium:500,semibold:600,bold:700},component_size:{content_max_width:'1120px',logo:'72px',logo_compact:'32px',camera_height:'200px',navigation_max_width:'960px',navigation_item_width:'82px',panel_bottom_space:'96px',flow_node_min_height:'96px',header:'56px',bottom_nav:'64px',nav_rail:'80px',sidebar:'216px',nav_item:'52px',tile_icon:'42px',status_icon:'42px',status:'68px',quick_tile:'72px',toggle_dot:'18px',installer_max_width:'980px',dialog_max_width:'420px',toast_max_width:'520px'},touch_target:'44px',breakpoints:{phone:480,tablet:768,desktop:1200},motion:{fast:'120ms',normal:'180ms',slow:'280ms',flow:'1.4s',skeleton:'1.2s',easing:'cubic-bezier(.2,0,0,1)'},state:{active:'#32E394',disabled:'#71859A',warning:'#FFD05C',error:'#FF5B69'},opacity:{disabled:.48},effect:{blur_nav:'18px',blur_dialog:'8px',focus_ring:'2px solid var(--cl-primary)'}},themes:[{id:'cl_blue',name:'CL Blue',mode:'dark',colors:{}}]},frontend:{show_version:false,gestures:{slider_threshold_px:10}},customer_ui:{default_theme:'cl_blue',modules:['lights','covers','climate','energy','security','cameras','support'],experience:{default_level:'standard',levels:['essential','standard','pro']},environment:{classification_confidence_threshold:.75,thresholds:{humidity:{warning_low:30,warning_high:65,high:75},co2:{warning_high:1000,high:1500}}},labels:{}},discovery:{classification_confidence_threshold:.75,experience_rules:{essential_domains:['light','switch','cover','climate','camera'],standard_domains:['sensor']}},site:{site_name:'Casa Demo',customer:'Cliente Demo',support:{}},runtime:{theme:'cl_blue',hidden:[],favorites:['light.cucina'],aliases:{},switch_types:{},entity_modules:{},entity_areas:{},entity_subtypes:{},entity_visibility:{},area_order:[],entity_order:[],home_order:['lights','climate','environment','covers','energy','cameras','support'],energy:{solar:'sensor.solar_power',home:'sensor.home_power'},area_switches:{},support:{site_name:'Casa Demo',customer:'Cliente Demo',phone:'',whatsapp:''},experience_level:'standard',module_levels:{},entity_levels:{}}};
  bootstrap.version='3.4.2-dev';
  bootstrap.runtime.layout={layout_schema_version:1,base:{},mobile:{},tablet:{},wall:{}};
  const requestedTheme=new URLSearchParams(location.search).get('theme')||'cl_blue';
  Object.assign(bootstrap.branding.design_tokens.opacity,{soft:.14,strong:.70});
  Object.assign(bootstrap.branding.design_tokens.component_size,{logo_compact:'52px',logo_desktop:'58px',header:'58px',choice_list_max_height:'240px'});
  bootstrap.branding.themes.push({id:'light',name:'Light',mode:'light',colors:{background:'#EEF4F8',surface:'#FFFFFF',surface_alt:'#E4EDF3',text:'#102538',muted:'#5E7182',line:'rgba(16,37,56,.16)'}},{id:'dark',name:'Dark',mode:'dark',colors:{}},{id:'auto',name:'Auto',mode:'auto',colors:{}},{id:'night',name:'Night',mode:'dark',colors:{}},{id:'contrast',name:'Contrast',mode:'dark',colors:{}});
  bootstrap.runtime.theme=requestedTheme;
  bootstrap.runtime.entity_modules={};
  const areas=[{area_id:'living',name:'Zona giorno'},{area_id:'night',name:'Zona notte'}];
  const entities=Object.keys(states).map(entity_id=>({entity_id,area_id:entity_id.includes('camera')?'night':'living',platform:entity_id==='binary_sensor.bar_serranda'||entity_id==='alarm_control_panel.casa'?'risco':entity_id.includes('shelly')?'shelly':'demo',name:null,original_name:states[entity_id].attributes.friendly_name,...(entity_id==='binary_sensor.bar_serranda'?{original_device_class:'motion',device_id:'risco-zone',config_entry_id:'risco-entry'}:entity_id==='alarm_control_panel.casa'?{device_id:'risco-panel',config_entry_id:'risco-entry'}:{})}));
  const devices=[{id:'risco-zone',name:'Bar.Serranda',manufacturer:'Risco',model:'LightSYS',area_id:'living',identifiers:[['risco','demo_zone_32']]},{id:'risco-panel',name:'Centrale',manufacturer:'Risco',model:'LightSYS',area_id:'living',identifiers:[['risco','demo_panel']]}];
  const technicalPowerEntity=entities.find(entity=>entity.entity_id==='light.cl_power_control_status');
  Object.assign(technicalPowerEntity,{platform:'cl_power_control',entity_category:'diagnostic',original_name:'Controller status'});
  const panel=document.querySelector('cl-control-panel');
  if(new URLSearchParams(location.search).get('context')==='dashboard')panel.panel={config:{dashboard_context:true}};
  panel.hass={states,user:{is_admin:true},callService:async()=>{},callWS:async message=>{if(message.type==='cl_control/bootstrap/get')return bootstrap;if(message.type==='cl_control/installer/status')return{unlocked:false};if(message.type==='cl_control/installer/unlock')return{unlocked:true,remaining_attempts:4};if(message.type==='config/area_registry/list')return areas;if(message.type==='config/entity_registry/list')return entities;if(message.type==='config/device_registry/list')return devices;return{};}};
  window.__clWsCalls=[];
  const originalCallWS=panel.hass.callWS;
  panel.hass.callWS=async message=>{
    window.__clWsCalls.push(message);
    if(message.type==='cl_control/layout/set'){
      bootstrap.runtime.layout[message.context]??={};
      bootstrap.runtime.layout[message.context][message.view]=message.cards;
      return bootstrap.runtime.layout;
    }
    if(message.type==='cl_control/layout/reset'){
      delete bootstrap.runtime.layout[message.context]?.[message.view];
      return bootstrap.runtime.layout;
    }
    if(message.type==='cl_control/config/set'){bootstrap.runtime=structuredClone(message.config);return bootstrap.runtime;}
    if(message.type==='cl_control/config/get')return bootstrap.runtime;
    return originalCallWS(message);
  };
</script>
</html>
