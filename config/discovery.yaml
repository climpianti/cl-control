schema_version: 1
enabled: true
domains:
  - light
  - switch
  - valve
  - cover
  - climate
  - sensor
  - binary_sensor
  - camera
  - alarm_control_panel
  - select
ignore_unavailable: false
classification_confidence_threshold: 0.75

experience_rules:
  essential_domains:
    - light
    - switch
    - valve
    - cover
    - alarm_control_panel
  standard_domains:
    - climate
    - camera
  pro_domains:
    - sensor
    - binary_sensor
    - select
  installer_patterns:
    - "^update\\."
    - "^sensor\\..*(cpu|memory|version|diagnostic)"
    - "^binary_sensor\\..*_in_esecuzione$"
