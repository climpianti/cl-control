schema_version: 1

# whatsapp | openai | hybrid
provider: "whatsapp"

# Pay-per-use gate. False guarantees that no AI provider is called.
ai_enabled: false
ai_provider: "mock"
model: "mock-disabled"

limits:
  # Zero means unlimited. AI is still blocked while ai_enabled is false.
  requests_per_month: 0
  conversations_per_month: 0
  tokens_per_month: 0
  max_context_tokens: 4000
  max_output_tokens: 600
  timeout_seconds: 20
  # Zero means no monetary cap. The reserve prevents the last request from
  # starting when it could exceed the configured monthly budget.
  monthly_budget_eur: 0.0
  estimated_max_request_cost_eur: 0.10

fallback_whatsapp: true
confidence_threshold: 0.75
escalate_critical: true

categories:
  - Luci
  - Clima
  - Sicurezza
  - Energia
  - Telecamere
  - Altro

severity_levels:
  - info
  - warning
  - critical

diagnostics:
  enabled: false
  allowed_fields: []
  require_customer_consent: true

allowed_tools:
  - read_entity_state
  - device_availability
  - area_summary
  - authorized_recent_errors
  - safe_diagnostics
  - knowledge_base
  - create_ticket
  - escalate_whatsapp

ticketing:
  enabled: true
  max_persisted_requests: 200
  statuses:
    - new
    - in_progress
    - resolved
